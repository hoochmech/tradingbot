# Copy to config.toml and edit. Live mode is disabled in code until paper trading has been reviewed.
mode = "paper"                 # backtest | paper | live
exchange = "krakenfutures"     # ccxt exchange id (see README about Kraken US accounts)
timeframe = "1h"
starting_equity = 500.0
taker_fee_pct = 0.05
funding_rate_per_8h_pct = 0.01
kill_switch_file = "KILL"
heartbeat_hours = 6            # how often your phone gets a status update

# Account-wide limits. Hard ceilings in bot/config.py: 5x leverage, 2% risk per trade, 5% daily loss.
[risk]
daily_loss_limit_pct = 3.0     # no new trades for the rest of the UTC day
max_drawdown_pct = 15.0        # kill switch trips: close everything and stop
min_liq_buffer_pct = 50.0
maintenance_margin_pct = 1.0

# 1:2 safe:aggressive. Weights split the account: safe gets 1/3 (~$167), aggressive 2/3 (~$333).
# Each sleeve trades a different coin so their positions never cancel each other out on the exchange.
[[sleeves]]
name = "safe"
weight = 1
symbol = "BTC/USD:USD"
strategy = "ema_trend"         # trend-following, only trades with the long-term trend
max_leverage = 2.0
risk_per_trade_pct = 0.75      # ~$1.25 lost if a stop is hit
params = { fast_ema = 20, slow_ema = 50, trend_ema = 200, atr_period = 14, atr_stop_mult = 2.5, atr_target_mult = 5.0 }

[[sleeves]]
name = "aggressive"
weight = 2
symbol = "ETH/USD:USD"
strategy = "breakout"          # buys/sells breaks of the 20-bar range
max_leverage = 4.0
risk_per_trade_pct = 1.5       # ~$5 lost if a stop is hit
params = { lookback = 20, atr_period = 14, atr_stop_mult = 1.5, atr_target_mult = 3.0 }
