# Copy to config.toml and edit. Live mode is disabled in code until paper trading has been reviewed.
# If you delete the [[sleeves]] sections, the built-in defaults in bot/config.py are used.
mode = "paper"                 # backtest | paper | live
exchange = "krakenfutures"     # ccxt exchange id (see README about Kraken US accounts)
timeframe = "4h"               # 4-hour candles: fewer trades, much less lost to fees than 1h
starting_equity = 500.0
taker_fee_pct = 0.05           # market orders and stop exits
maker_fee_pct = 0.02           # limit orders resting on the book
funding_rate_per_8h_pct = 0.01
entry_order = "limit"          # limit = cheaper but can miss a fast move; market = always fills
limit_ttl_bars = 1             # cancel an unfilled limit entry after one candle
vol_sizing = true              # risk less on a coin when it's wilder than usual, more when calmer
vol_lookback = 500
vol_scale_min = 0.5
vol_scale_max = 1.25           # still capped by the 2% hard ceiling
kill_switch_file = "KILL"
heartbeat_hours = 6            # how often your phone gets a status update

# Account-wide limits. Hard ceilings in bot/config.py: 5x leverage, 2% risk per trade, 5% daily loss.
[risk]
daily_loss_limit_pct = 3.0     # no new trades for the rest of the UTC day
max_drawdown_pct = 15.0        # kill switch trips: close everything and stop
min_liq_buffer_pct = 50.0
maintenance_margin_pct = 1.0

# 1:2 safe:aggressive by capital. Safe third: BTC + ETH. Aggressive two-thirds: SOL, XRP, POL, ARB.
# Strategy: breakout of the last 40 candles, only in the direction of the 200 EMA.
# Exits: initial stop at atr_stop_mult x ATR, then a trailing stop trail_atr_mult x ATR behind the best price.
[[sleeves]]
name = "safe-BTC"
group = "safe"
weight = 0.5
symbol = "BTC/USD:USD"
strategy = "breakout"
max_leverage = 2.0
risk_per_trade_pct = 0.75
params = { lookback = 40, trend_ema = 200, atr_period = 14, atr_stop_mult = 3.0, trail_atr_mult = 6.0 }

